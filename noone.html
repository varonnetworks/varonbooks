<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프리테스트 선착순 증정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #ffffff;
    --bg-soft: #f6f6f8;
    --card: #ffffff;
    --card-border: #e4e4e9;
    --ink: #1a1c26;
    --ink-dim: #8b8f9e;
    --amber: #e8890c;
    --amber-dim: #f4d9ae;
    --red: #e0403f;
    --blue: #1c7ed6;
    --green: #16a35e;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Space Grotesk', 'Noto Sans KR', sans-serif;
    --body: 'Noto Sans KR', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--body);
    min-height:100vh;
    padding:28px 24px 80px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    max-width:1400px;
    margin:0 auto 28px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:12px;
  }
  .brand h1{
    font-family:var(--display);
    font-weight:700;
    font-size:52px;
    margin:0;
    letter-spacing:-0.02em;
    background:linear-gradient(90deg, #e8890c 0%, #ff5d5d 40%, #1c7ed6 80%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 2px 10px rgba(232,137,12,0.25));
  }
  .brand .sub{
    font-family:var(--mono);
    font-size:13px;
    color:var(--ink-dim);
    letter-spacing:0.08em;
  }
  .status-pill{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 12px;
    border:1px solid var(--card-border);
    border-radius:100px;
    background:var(--bg-soft);
  }
  .status-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .actions{display:flex;gap:8px;}
  .btn{
    font-family:var(--body);
    font-weight:500;
    font-size:14px;
    padding:9px 16px;
    border-radius:10px;
    border:1px solid var(--card-border);
    background:var(--bg-soft);
    color:var(--ink);
    cursor:pointer;
    transition:all .15s ease;
  }
  .btn:hover{border-color:var(--amber);color:var(--amber);}
  .btn.primary{
    background:var(--amber);
    color:#1a1200;
    border-color:var(--amber);
    font-weight:700;
  }
  .btn.primary:hover{filter:brightness(1.08);color:#1a1200;}
  .btn.danger:hover{border-color:var(--red);color:var(--red);}
  .btn.small{padding:6px 11px;font-size:12.5px;}

  .levels{
    max-width:1400px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:26px;
  }
  .level-block{
    background:var(--bg-soft);
    border:1px solid var(--card-border);
    border-radius:20px;
    padding:24px 26px 26px;
  }
  .level-head{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:18px;
  }
  .level-name{
    font-family:var(--display);
    font-weight:700;
    font-size:38px;
    letter-spacing:-0.02em;
  }
  .level-line{
    flex:1;
    height:1px;
    background:linear-gradient(to right, var(--card-border), transparent);
  }
  .grid{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:16px 22px;
    position:relative;
    overflow:hidden;
    transition:border-color .2s ease;
    display:flex;
    align-items:center;
    gap:22px;
  }
  .card.ok{border-color:rgba(28,126,214,0.35); background:linear-gradient(90deg, rgba(28,126,214,0.05), var(--card) 30%);}
  .card.low{border-color:rgba(232,137,12,0.5); background:linear-gradient(90deg, rgba(232,137,12,0.07), var(--card) 30%);}
  .card.zero{border-color:rgba(224,64,63,0.8); background:linear-gradient(90deg, rgba(224,64,63,0.06), var(--card) 30%);}
  .card-top{
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:1;
    min-width:0;
  }
  .test-type{
    font-size:36px;
    font-weight:700;
    color:var(--ink);
    line-height:1.25;
    letter-spacing:-0.01em;
  }
  .count-row{
    display:flex;
    align-items:baseline;
    gap:8px;
    flex-shrink:0;
    min-width:150px;
    justify-content:flex-end;
  }
  .count{
    font-family:var(--display);
    font-weight:700;
    font-size:64px;
    line-height:1;
    letter-spacing:-0.02em;
  }
  .count.ok{color:var(--blue);}
  .count.low{color:var(--amber);}
  .count.zero{color:var(--red);}
  .count-unit{
    font-family:var(--mono);
    font-size:14px;
    color:var(--ink-dim);
  }
  .take-btn{
    flex-shrink:0;
    width:44px;
    height:44px;
    padding:0;
    border-radius:10px;
    border:none;
    background:#232733;
    color:#fff;
    font-family:var(--display);
    font-weight:700;
    font-size:18px;
    cursor:pointer;
    transition:all .12s ease;
  }
  .take-btn:hover:not(:disabled){background:var(--amber);color:#fff;transform:translateY(-1px);}
  .take-btn:active:not(:disabled){transform:scale(0.97);}
  .take-btn:disabled{opacity:0.3;cursor:not-allowed;}
  .edit-row{
    display:flex;
    gap:6px;
    margin-top:10px;
  }
  .edit-row .btn{flex:1;text-align:center;padding:7px 0;}

  .empty{
    text-align:center;
    color:var(--ink-dim);
    padding:60px 20px;
    font-size:14px;
  }

  /* Manage panel */
  .manage-panel{
    max-width:1400px;
    margin:0 auto 24px;
    background:var(--bg-soft);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:20px;
  }
  .manage-title{
    font-family:var(--display);
    font-weight:700;
    font-size:15px;
    margin-bottom:14px;
    color:var(--amber);
  }
  .form-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .form-row input{
    background:var(--card);
    border:1px solid var(--card-border);
    color:var(--ink);
    padding:9px 12px;
    border-radius:9px;
    font-family:var(--body);
    font-size:13.5px;
    flex:1;
    min-width:120px;
  }
  .form-row input:focus{outline:none;border-color:var(--amber);}
  .form-row input[type=number]{max-width:100px;flex:none;}

  .manage-list{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:14px;
  }
  .manage-item{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:10px;
    padding:8px 12px;
    font-size:13px;
  }
  .manage-item .mi-label{flex:1;color:var(--ink-dim);}
  .manage-item .mi-label b{color:var(--ink);font-weight:600;}
  .manage-item input[type=number]{
    width:64px;background:var(--bg);border:1px solid var(--card-border);color:var(--ink);
    border-radius:7px;padding:5px 8px;font-family:var(--mono);text-align:center;
  }

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--card);border:1px solid var(--card-border);
    color:var(--ink);padding:10px 18px;border-radius:10px;
    font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.4);
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .setup-notice{
    max-width:640px;margin:80px auto;text-align:center;
    background:var(--bg-soft);border:1px solid var(--card-border);
    border-radius:16px;padding:36px 28px;
  }
  .setup-notice h2{font-family:var(--display);margin-top:0;}
  .setup-notice code{
    display:block;text-align:left;background:#1a1c26;padding:14px;border-radius:10px;
    font-family:var(--mono);font-size:12px;color:#f4c778;margin-top:16px;overflow-x:auto;white-space:pre;
  }

  @media (max-width:760px){
    .level-name{font-size:28px;}
    .card{flex-wrap:wrap;padding:16px 18px;gap:12px;}
    .card-top{flex:1 1 100%;order:1;}
    .count-row{order:2;min-width:0;flex:1;justify-content:flex-start;}
    .count{font-size:44px;}
    .take-btn{order:3;}
    .test-type{font-size:26px;}
  }

  /* Timer section */
  .timer-section{
    max-width:1400px;
    margin:0 auto 26px;
    background:var(--bg-soft);
    border:1px solid var(--card-border);
    border-radius:20px;
    padding:22px 24px 26px;
  }
  .timer-head{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:16px;
  }
  .timer-head h2{
    font-family:var(--display);
    font-weight:700;
    font-size:22px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .timer-form{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    margin-bottom:18px;
  }
  .timer-form input[type=text]{
    background:var(--card);
    border:1px solid var(--card-border);
    color:var(--ink);
    padding:10px 14px;
    border-radius:9px;
    font-family:var(--body);
    font-size:14px;
    flex:1;
    min-width:160px;
  }
  .timer-form input[type=text]:focus{outline:none;border-color:var(--amber);}
  .timer-form input[type=number]{
    width:64px;
    background:var(--card);
    border:1px solid var(--card-border);
    color:var(--ink);
    padding:10px 8px;
    border-radius:9px;
    font-family:var(--mono);
    font-size:14px;
    text-align:center;
  }
  .timer-form .sep{color:var(--ink-dim);font-family:var(--mono);}
  .preset-btn{
    padding:10px 16px;
    border-radius:9px;
    border:1px solid var(--card-border);
    background:var(--card);
    color:var(--ink);
    font-family:var(--body);
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .preset-btn:hover{border-color:var(--amber);color:var(--amber);}

  .timer-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(200px,1fr));
    gap:14px;
  }
  .timer-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:16px 18px;
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:background .15s ease, border-color .15s ease;
  }
  .timer-label{
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    line-height:1.3;
    word-break:break-word;
  }
  .timer-clock{
    font-family:var(--display);
    font-weight:700;
    font-size:40px;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  .timer-stop{
    align-self:flex-start;
    padding:6px 12px;
    border-radius:8px;
    border:1px solid var(--card-border);
    background:transparent;
    color:var(--ink-dim);
    font-family:var(--body);
    font-size:12.5px;
    cursor:pointer;
  }
  .timer-stop:hover{border-color:var(--red);color:var(--red);}
  .timer-empty{
    color:var(--ink-dim);
    font-size:13px;
    padding:10px 4px;
  }
  @keyframes timer-blink{
    0%,100%{background:var(--card); border-color:var(--card-border);}
    50%{background:rgba(224,64,63,0.85); border-color:var(--red);}
  }
  .timer-card.done{
    animation:timer-blink 1s step-start infinite;
  }
  .timer-card.done .timer-clock,
  .timer-card.done .timer-label{
    color:#fff;
  }
</style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div class="brand">
      <h1>🔥 프리테스트 선착순 증정</h1>
    </div>
    <div class="actions">
      <span class="status-pill"><span class="status-dot"></span><span id="syncLabel">연결 중</span></span>
      <button class="btn" id="manageToggle">관리 모드</button>
    </div>
  </div>

  <div id="managePanel" class="manage-panel" style="display:none;">
    <div class="manage-title">레벨 · 시험 종류 추가</div>
    <div class="form-row">
      <input type="text" id="newLevel" placeholder="레벨 (예: IS3)">
      <input type="text" id="newTestType" placeholder="시험 종류 (예: 프리테스트 A)">
      <input type="number" id="newQty" placeholder="수량" min="0">
      <button class="btn primary" id="addItemBtn">추가</button>
    </div>
    <div class="manage-title" style="margin-top:20px;">전체 항목 관리 / 재고 리셋</div>
    <div class="manage-list" id="manageList"></div>
  </div>

  <div class="timer-section">
    <div class="timer-head"><h2>⏱ 타이머</h2></div>
    <div class="timer-form">
      <input type="text" id="timerLabel" placeholder="이름/메모 (예: 김민준 재시)">
      <button class="preset-btn" data-preset-min="5">5분</button>
      <button class="preset-btn" data-preset-min="20">20분</button>
      <span class="sep">직접입력</span>
      <input type="number" id="timerMin" placeholder="분" min="0">
      <span class="sep">:</span>
      <input type="number" id="timerSec" placeholder="초" min="0" max="59">
      <button class="btn primary" id="startTimerBtn">타이머 시작</button>
    </div>
    <div class="timer-grid" id="timerGrid"></div>
  </div>

  <div class="levels" id="levels"></div>
</div>

<div class="toast" id="toast"></div>


<script>
/* ====== Supabase 설정 : 아래 두 값을 본인 프로젝트 값으로 채워주세요 ====== */
const SUPABASE_URL = "https://ktizqdrhndefvoeltjko.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0aXpxZHJobmRlZnZvZWx0amtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTcxOTcsImV4cCI6MjA5MzY3MzE5N30.p3v9VZSgTr_ngL-QN8L_7hoORk1auTqMk8l6NWuE0Yk";
/* ======================================================================= */

const isConfigured = !SUPABASE_URL.includes("YOUR_") && !SUPABASE_ANON_KEY.includes("YOUR_");

const toastEl = document.getElementById('toast');
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>toastEl.classList.remove('show'), 1800);
}

if(!isConfigured){
  document.getElementById('app').innerHTML = `
    <div class="setup-notice">
      <h2>설정이 필요해요</h2>
      <p style="color:var(--ink-dim);font-size:14px;line-height:1.6;">
        Supabase 프로젝트를 만들고 아래 SQL을 실행한 뒤,<br>
        코드 상단의 SUPABASE_URL / SUPABASE_ANON_KEY 값을 채워 넣어주세요.
      </p>
      <code>create table pretest_stock (
  id uuid primary key default gen_random_uuid(),
  level text not null,
  test_type text not null,
  quantity int not null default 0,
  display_order bigint not null default extract(epoch from now())*1000,
  updated_at timestamptz default now()
);

alter publication supabase_realtime add table pretest_stock;

alter table pretest_stock enable row level security;

create policy "public read" on pretest_stock for select using (true);
create policy "public write" on pretest_stock for insert with check (true);
create policy "public update" on pretest_stock for update using (true);
create policy "public delete" on pretest_stock for delete using (true);</code>
    </div>`;
} else {
  runApp();
}

function runApp(){
  const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const levelsEl = document.getElementById('levels');
  const manageList = document.getElementById('manageList');
  const manageToggle = document.getElementById('manageToggle');
  const managePanel = document.getElementById('managePanel');
  const syncLabel = document.getElementById('syncLabel');

  let items = [];
  let manageMode = false;

  manageToggle.addEventListener('click', ()=>{
    manageMode = !manageMode;
    managePanel.style.display = manageMode ? 'block' : 'none';
    manageToggle.textContent = manageMode ? '표시 모드로 돌아가기' : '관리 모드';
    manageToggle.classList.toggle('primary', manageMode);
    render();
  });

  document.getElementById('addItemBtn').addEventListener('click', async ()=>{
    const level = document.getElementById('newLevel').value.trim();
    const testType = document.getElementById('newTestType').value.trim();
    const qty = parseInt(document.getElementById('newQty').value, 10);
    if(!level || !testType || isNaN(qty)){
      toast('레벨, 시험 종류, 수량을 모두 입력해주세요');
      return;
    }
    const { error } = await supa.from('pretest_stock').insert({
      level, test_type: testType, quantity: qty, display_order: Date.now()
    });
    if(error){ toast('추가 실패: '+error.message); return; }
    document.getElementById('newLevel').value = '';
    document.getElementById('newTestType').value = '';
    document.getElementById('newQty').value = '';
    toast('추가되었습니다');
  });

  async function fetchAll(){
    const { data, error } = await supa.from('pretest_stock').select('*').order('display_order', {ascending:true});
    if(error){ syncLabel.textContent = '연결 오류'; console.error(error); return; }
    items = data || [];
    syncLabel.textContent = '실시간 연결됨';
    render();
    renderManage();
  }

  async function decrement(item){
    if(item.quantity <= 0) return;
    const newQty = item.quantity - 1;
    // optimistic update
    item.quantity = newQty;
    render();
    const { error } = await supa.from('pretest_stock').update({ quantity:newQty, updated_at:new Date().toISOString() }).eq('id', item.id);
    if(error) toast('업데이트 실패: '+error.message);
  }

  async function setQuantity(item, val){
    const n = parseInt(val, 10);
    if(isNaN(n) || n < 0) return;
    const { error } = await supa.from('pretest_stock').update({ quantity:n, updated_at:new Date().toISOString() }).eq('id', item.id);
    if(error){ toast('업데이트 실패: '+error.message); return; }
    toast(`${item.level} · ${item.test_type} → ${n}장으로 설정`);
  }

  async function deleteItem(item){
    if(!confirm(`"${item.level} - ${item.test_type}" 항목을 삭제할까요?`)) return;
    const { error } = await supa.from('pretest_stock').delete().eq('id', item.id);
    if(error) toast('삭제 실패: '+error.message);
  }

  function groupByLevel(list){
    const map = new Map();
    list.forEach(it=>{
      if(!map.has(it.level)) map.set(it.level, []);
      map.get(it.level).push(it);
    });
    return map;
  }

  function render(){
    if(!items.length){
      levelsEl.innerHTML = `<div class="empty">등록된 항목이 없어요.<br>상단 "관리 모드"에서 레벨과 시험 종류를 추가해주세요.</div>`;
      return;
    }
    const grouped = groupByLevel(items);
    let html = '';
    for(const [level, list] of grouped){
      html += `<div class="level-block">
        <div class="level-head">
          <div class="level-name">${escapeHtml(level)}</div>
          <div class="level-line"></div>
        </div>
        <div class="grid">
          ${list.map(it=>cardHtml(it)).join('')}
        </div>
      </div>`;
    }
    levelsEl.innerHTML = html;

    // bind take buttons
    levelsEl.querySelectorAll('[data-take]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const item = items.find(i=>i.id === btn.dataset.take);
        if(item) decrement(item);
      });
    });
  }

  function cardHtml(it){
    const q = it.quantity;
    const tier = q <= 3 ? 'zero' : q <= 6 ? 'low' : 'ok';
    const zero = q <= 0;
    return `<div class="card ${tier}">
      <div class="card-top">
        <div class="test-type">${escapeHtml(it.test_type)}</div>
      </div>
      <div class="count-row">
        <div class="count ${tier}">${it.quantity}</div>
        <div class="count-unit">장 남음</div>
      </div>
      <button class="take-btn" data-take="${it.id}" ${zero?'disabled':''}>−1</button>
    </div>`;
  }

  function renderManage(){
    if(!items.length){
      manageList.innerHTML = `<div style="color:var(--ink-dim);font-size:13px;">등록된 항목이 없습니다.</div>`;
      return;
    }
    manageList.innerHTML = items.map(it=>`
      <div class="manage-item">
        <div class="mi-label"><b>${escapeHtml(it.level)}</b> · ${escapeHtml(it.test_type)}</div>
        <input type="number" min="0" value="${it.quantity}" data-setqty="${it.id}">
        <button class="btn small" data-resetbtn="${it.id}">적용</button>
        <button class="btn small danger" data-delbtn="${it.id}">삭제</button>
      </div>
    `).join('');

    manageList.querySelectorAll('[data-resetbtn]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.resetbtn;
        const input = manageList.querySelector(`input[data-setqty="${id}"]`);
        const item = items.find(i=>i.id===id);
        if(item) setQuantity(item, input.value);
      });
    });
    manageList.querySelectorAll('[data-delbtn]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.delbtn;
        const item = items.find(i=>i.id===id);
        if(item) deleteItem(item);
      });
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ===== 타이머 ===== */
  const timerGrid = document.getElementById('timerGrid');
  const timerLabelInput = document.getElementById('timerLabel');
  const timerMinInput = document.getElementById('timerMin');
  const timerSecInput = document.getElementById('timerSec');

  let timers = [];

  async function fetchTimers(){
    const { data, error } = await supa.from('pretest_timers').select('*').order('created_at', {ascending:true});
    if(error){ console.error(error); return; }
    timers = data || [];
    renderTimers();
  }

  async function startTimer(label, totalSeconds){
    if(totalSeconds <= 0){ toast('시간을 입력해주세요'); return; }
    const endAt = new Date(Date.now() + totalSeconds*1000).toISOString();
    const { error } = await supa.from('pretest_timers').insert({
      label: label || '타이머',
      duration_seconds: totalSeconds,
      end_at: endAt
    });
    if(error){ toast('타이머 시작 실패: '+error.message); return; }
  }

  async function deleteTimer(id){
    const { error } = await supa.from('pretest_timers').delete().eq('id', id);
    if(error) toast('삭제 실패: '+error.message);
  }

  document.querySelectorAll('.preset-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const mins = parseInt(btn.dataset.presetMin, 10);
      startTimer(timerLabelInput.value.trim(), mins*60);
      timerLabelInput.value = '';
    });
  });

  document.getElementById('startTimerBtn').addEventListener('click', ()=>{
    const mins = parseInt(timerMinInput.value, 10) || 0;
    const secs = parseInt(timerSecInput.value, 10) || 0;
    startTimer(timerLabelInput.value.trim(), mins*60 + secs);
    timerLabelInput.value = '';
    timerMinInput.value = '';
    timerSecInput.value = '';
  });

  function formatClock(ms){
    const totalSec = Math.max(0, Math.ceil(ms/1000));
    const m = Math.floor(totalSec/60);
    const s = totalSec % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function renderTimers(){
    if(!timers.length){
      timerGrid.innerHTML = `<div class="timer-empty">진행 중인 타이머가 없어요. 위에서 이름 입력하고 시작해보세요.</div>`;
      return;
    }
    timerGrid.innerHTML = timers.map(t=>{
      const remaining = new Date(t.end_at).getTime() - Date.now();
      const done = remaining <= 0;
      return `<div class="timer-card ${done?'done':''}" data-timer-id="${t.id}">
        <div class="timer-label">${escapeHtml(t.label)}</div>
        <div class="timer-clock" data-clock="${t.id}">${formatClock(remaining)}</div>
        <button class="timer-stop" data-stop="${t.id}">${done ? '확인' : '중지'}</button>
      </div>`;
    }).join('');

    timerGrid.querySelectorAll('[data-stop]').forEach(btn=>{
      btn.addEventListener('click', ()=> deleteTimer(btn.dataset.stop));
    });
  }

  // 1초마다 로컬에서 남은 시간 재계산 (DB 재조회 없이)
  setInterval(()=>{
    if(!timers.length) return;
    let needsFullRerender = false;
    timers.forEach(t=>{
      const remaining = new Date(t.end_at).getTime() - Date.now();
      const clockEl = timerGrid.querySelector(`[data-clock="${t.id}"]`);
      const wasDone = clockEl && clockEl.closest('.timer-card').classList.contains('done');
      const isDone = remaining <= 0;
      if(isDone !== wasDone) needsFullRerender = true;
      if(clockEl) clockEl.textContent = formatClock(remaining);
    });
    if(needsFullRerender) renderTimers();
  }, 1000);

  /* ===== 초기 로드 & 실시간 구독 ===== */
  fetchAll();
  fetchTimers();

  // realtime subscription — 모든 기기가 즉시 반영됨
  supa.channel('pretest_stock_changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'pretest_stock' }, () => {
      fetchAll();
    })
    .subscribe((status)=>{
      if(status === 'SUBSCRIBED') syncLabel.textContent = '실시간 연결됨';
    });

  supa.channel('pretest_timers_changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'pretest_timers' }, () => {
      fetchTimers();
    })
    .subscribe();
}
</script>
</body>
</html>

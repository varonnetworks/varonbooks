<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프리테스트 재고 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #12141c;
    --bg-soft: #181b26;
    --card: #1e2230;
    --card-border: #2a2f42;
    --ink: #eef0f6;
    --ink-dim: #8b90a6;
    --amber: #ffb648;
    --amber-dim: #7a5a24;
    --red: #ff5d5d;
    --green: #4ade8a;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Space Grotesk', 'Noto Sans KR', sans-serif;
    --body: 'Noto Sans KR', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(255,182,72,0.06), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(74,222,138,0.05), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:var(--body);
    min-height:100vh;
    padding:28px 20px 80px;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    max-width:1400px;
    margin:0 auto 28px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:12px;
  }
  .brand h1{
    font-family:var(--display);
    font-weight:700;
    font-size:26px;
    margin:0;
    letter-spacing:-0.02em;
  }
  .brand .sub{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-dim);
    letter-spacing:0.04em;
  }
  .status-pill{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 12px;
    border:1px solid var(--card-border);
    border-radius:100px;
    background:var(--bg-soft);
  }
  .status-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .actions{display:flex;gap:8px;}
  .btn{
    font-family:var(--body);
    font-weight:500;
    font-size:14px;
    padding:9px 16px;
    border-radius:10px;
    border:1px solid var(--card-border);
    background:var(--bg-soft);
    color:var(--ink);
    cursor:pointer;
    transition:all .15s ease;
  }
  .btn:hover{border-color:var(--amber);color:var(--amber);}
  .btn.primary{
    background:var(--amber);
    color:#1a1200;
    border-color:var(--amber);
    font-weight:700;
  }
  .btn.primary:hover{filter:brightness(1.08);color:#1a1200;}
  .btn.danger:hover{border-color:var(--red);color:var(--red);}
  .btn.small{padding:6px 11px;font-size:12.5px;}
  .levels{
    max-width:1400px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:26px;
  }
  .level-block{
    background:var(--bg-soft);
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:20px 22px 24px;
  }
  .level-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
  }
  .level-name{
    font-family:var(--display);
    font-weight:700;
    font-size:20px;
    letter-spacing:-0.01em;
  }
  .level-line{
    flex:1;
    height:1px;
    background:linear-gradient(to right, var(--card-border), transparent);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:14px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:18px 18px 16px;
    position:relative;
    overflow:hidden;
    transition:border-color .2s ease;
  }
  .card.low{border-color:rgba(255,93,93,0.55);}
  .card.zero{border-color:rgba(255,93,93,0.9); background:linear-gradient(180deg, rgba(255,93,93,0.08), var(--card));}
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:10px;
  }
  .test-type{
    font-size:14.5px;
    font-weight:500;
    color:var(--ink);
    line-height:1.3;
  }
  .stack{
    display:flex;
    flex-direction:column-reverse;
    gap:3px;
    height:34px;
    justify-content:flex-start;
    align-items:flex-end;
    width:34px;
  }
  .sheet{
    height:3px;
    border-radius:2px;
    background:var(--amber-dim);
    transition:width .2s ease, background .2s ease;
  }
  .sheet.on{background:var(--amber);}
  .count-row{
    display:flex;
    align-items:baseline;
    gap:6px;
    margin:6px 0 14px;
  }
  .count{
    font-family:var(--display);
    font-weight:700;
    font-size:52px;
    line-height:1;
    letter-spacing:-0.02em;
  }
  .count.zero{color:var(--red);}
  .count-unit{
    font-family:var(--mono);
    font-size:13px;
    color:var(--ink-dim);
  }
  .take-btn{
    width:100%;
    padding:12px 0;
    border-radius:11px;
    border:none;
    background:#2a2f42;
    color:var(--ink);
    font-family:var(--body);
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:all .12s ease;
    letter-spacing:-0.01em;
  }
  .take-btn:hover:not(:disabled){background:var(--amber);color:#1a1200;transform:translateY(-1px);}
  .take-btn:active:not(:disabled){transform:scale(0.97);}
  .take-btn:disabled{opacity:0.35;cursor:not-allowed;}
  .edit-row{
    display:flex;
    gap:6px;
    margin-top:10px;
  }
  .edit-row .btn{flex:1;text-align:center;padding:7px 0;}
  .empty{
    text-align:center;
    color:var(--ink-dim);
    padding:60px 20px;
    font-size:14px;
  }
  /* Manage panel */
  .manage-panel{
    max-width:1400px;
    margin:0 auto 24px;
    background:var(--bg-soft);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:20px;
  }
  .manage-title{
    font-family:var(--display);
    font-weight:700;
    font-size:15px;
    margin-bottom:14px;
    color:var(--amber);
  }
  .form-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .form-row input{
    background:var(--card);
    border:1px solid var(--card-border);
    color:var(--ink);
    padding:9px 12px;
    border-radius:9px;
    font-family:var(--body);
    font-size:13.5px;
    flex:1;
    min-width:120px;
  }
  .form-row input:focus{outline:none;border-color:var(--amber);}
  .form-row input[type=number]{max-width:100px;flex:none;}
  .manage-list{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:14px;
  }
  .manage-item{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:10px;
    padding:8px 12px;
    font-size:13px;
  }
  .manage-item .mi-label{flex:1;color:var(--ink-dim);}
  .manage-item .mi-label b{color:var(--ink);font-weight:600;}
  .manage-item input[type=number]{
    width:64px;background:var(--bg);border:1px solid var(--card-border);color:var(--ink);
    border-radius:7px;padding:5px 8px;font-family:var(--mono);text-align:center;
  }
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--card);border:1px solid var(--card-border);
    color:var(--ink);padding:10px 18px;border-radius:10px;
    font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.4);
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
    z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .setup-notice{
    max-width:640px;margin:80px auto;text-align:center;
    background:var(--bg-soft);border:1px solid var(--card-border);
    border-radius:16px;padding:36px 28px;
  }
  .setup-notice h2{font-family:var(--display);margin-top:0;}
  .setup-notice code{
    display:block;text-align:left;background:var(--bg);padding:14px;border-radius:10px;
    font-family:var(--mono);font-size:12px;color:var(--amber);margin-top:16px;overflow-x:auto;white-space:pre;
  }
  @media (max-width:640px){
    .count{font-size:42px;}
    .grid{grid-template-columns:repeat(auto-fill, minmax(160px,1fr));}
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <h1>프리테스트 재고</h1>
      <span class="sub">PRETEST STOCK · LIVE</span>
    </div>
    <div class="actions">
      <span class="status-pill"><span class="status-dot"></span><span id="syncLabel">연결 중</span></span>
      <button class="btn" id="manageToggle">관리 모드</button>
    </div>
  </div>
  <div id="managePanel" class="manage-panel" style="display:none;">
    <div class="manage-title">레벨 · 시험 종류 추가</div>
    <div class="form-row">
      <input type="text" id="newLevel" placeholder="레벨 (예: IS3)">
      <input type="text" id="newTestType" placeholder="시험 종류 (예: 프리테스트 A)">
      <input type="number" id="newQty" placeholder="수량" min="0">
      <button class="btn primary" id="addItemBtn">추가</button>
    </div>
    <div class="manage-title" style="margin-top:20px;">전체 항목 관리 / 재고 리셋</div>
    <div class="manage-list" id="manageList"></div>
  </div>
  <div class="levels" id="levels"></div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ====== Supabase 설정 : 아래 두 값을 본인 프로젝트 값으로 채워주세요 ====== */
const SUPABASE_URL = "https://ktizqdrhndefvoeltjko.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0aXpxZHJobmRlZnZvZWx0amtvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTcxOTcsImV4cCI6MjA5MzY3MzE5N30.p3v9VZSgTr_ngL-QN8L_7hoORk1auTqMk8l6NWuE0Yk";
/* ======================================================================= */
const isConfigured = !SUPABASE_URL.includes("YOUR_") && !SUPABASE_ANON_KEY.includes("YOUR_");
const toastEl = document.getElementById('toast');
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>toastEl.classList.remove('show'), 1800);
}if(!isConfigured){
  document.getElementById('app').innerHTML = `
    <div class="setup-notice">
      <h2>설정이 필요해요</h2>
      <p style="color:var(--ink-dim);font-size:14px;line-height:1.6;">
        Supabase 프로젝트를 만들고 아래 SQL을 실행한 뒤,<br>
        코드 상단의 SUPABASE_URL / SUPABASE_ANON_KEY 값을 채워 넣어주세요.
      </p>
      <code>create table pretest_stock (
  id uuid primary key default gen_random_uuid(),
  level text not null,
  test_type text not null,
  quantity int not null default 0,
  display_order bigint not null default extract(epoch from now())*1000,
  updated_at timestamptz default now()
);
alter publication supabase_realtime add table pretest_stock;
alter table pretest_stock enable row level security;
create policy "public read" on pretest_stock for select using (true);
create policy "public write" on pretest_stock for insert with check (true);
create policy "public update" on pretest_stock for update using (true);
create policy "public delete" on pretest_stock for delete using (true);</code>
    </div>`;
} else {
  runApp();
}function runApp(){
  const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const levelsEl = document.getElementById('levels');
  const manageList = document.getElementById('manageList');
  const manageToggle = document.getElementById('manageToggle');
  const managePanel = document.getElementById('managePanel');
  const syncLabel = document.getElementById('syncLabel');
  let items = [];
  let manageMode = false;
  manageToggle.addEventListener('click', ()=>{
    manageMode = !manageMode;
    managePanel.style.display = manageMode ? 'block' : 'none';
    manageToggle.textContent = manageMode ? '표시 모드로 돌아가기' : '관리 모드';
    manageToggle.classList.toggle('primary', manageMode);
    render();
  });
  document.getElementById('addItemBtn').addEventListener('click', async ()=>{
    const level = document.getElementById('newLevel').value.trim();
    const testType = document.getElementById('newTestType').value.trim();
    const qty = parseInt(document.getElementById('newQty').value, 10);
    if(!level || !testType || isNaN(qty)){
      toast('레벨, 시험 종류, 수량을 모두 입력해주세요');
      return;
    }
    const { error } = await supa.from('pretest_stock').insert({
      level, test_type: testType, quantity: qty, display_order: Date.now()
    });
    if(error){ toast('추가 실패: '+error.message); return; }
    document.getElementById('newLevel').value = '';
    document.getElementById('newTestType').value = '';
    document.getElementById('newQty').value = '';
    toast('추가되었습니다');
  });
  async function fetchAll(){
    const { data, error } = await supa.from('pretest_stock').select('*').order('display_order', {ascending:true});
    if(error){ syncLabel.textContent = '연결 오류'; console.error(error); return; }
    items = data || [];
    syncLabel.textContent = '실시간 연결됨';
    render();
    renderManage();
  }
  async function decrement(item){
    if(item.quantity <= 0) return;
    const newQty = item.quantity - 1;
    // optimistic update
    item.quantity = newQty;
    render();
    const { error } = await supa.from('pretest_stock').update({ quantity:newQty, updated_at:new Date().toISOString() }).eq('id', item.id);
    if(error) toast('업데이트 실패: '+error.message);
  }
  async function setQuantity(item, val){
    const n = parseInt(val, 10);
    if(isNaN(n) || n < 0) return;
    const { error } = await supa.from('pretest_stock').update({ quantity:n, updated_at:new Date().toISOString() }).eq('id', item.id);
    if(error){ toast('업데이트 실패: '+error.message); return; }
    toast(`${item.level} · ${item.test_type} → ${n}장으로 설정`);
  }
  async function deleteItem(item){
    if(!confirm(`"${item.level} - ${item.test_type}" 항목을 삭제할까요?`)) return;
    const { error } = await supa.from('pretest_stock').delete().eq('id', item.id);
    if(error) toast('삭제 실패: '+error.message);
  }
  function groupByLevel(list){
    const map = new Map();
    list.forEach(it=>{
      if(!map.has(it.level)) map.set(it.level, []);
      map.get(it.level).push(it);
    });
    return map;
  }
  function sheetVisual(qty){
    const max = 8;
    const shown = Math.min(qty, max);
    let html = '';
    for(let i=0;i<max;i++){
      const on = i < shown;
      const width = 10 + (i * 2.2);
      html += `<div class="sheet ${on?'on':''}" style="width:${width}px;"></div>`;
    }
    return `<div class="stack">${html}</div>`;
  }
  function render(){
    if(!items.length){
      levelsEl.innerHTML = `<div class="empty">등록된 항목이 없어요.<br>상단 "관리 모드"에서 레벨과 시험 종류를 추가해주세요.</div>`;
      return;
    }
    const grouped = groupByLevel(items);
    let html = '';
    for(const [level, list] of grouped){
      html += `<div class="level-block">
        <div class="level-head">
          <div class="level-name">${escapeHtml(level)}</div>
          <div class="level-line"></div>
        </div>
        <div class="grid">
          ${list.map(it=>cardHtml(it)).join('')}
        </div>
      </div>`;
    }
    levelsEl.innerHTML = html;
    // bind take buttons
    levelsEl.querySelectorAll('[data-take]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const item = items.find(i=>i.id === btn.dataset.take);
        if(item) decrement(item);
      });
    });
  }
  function cardHtml(it){
    const zero = it.quantity <= 0;
    const low = it.quantity > 0 && it.quantity <= 1;
    return `<div class="card ${zero?'zero':low?'low':''}">
      <div class="card-top">
        <div class="test-type">${escapeHtml(it.test_type)}</div>
        ${sheetVisual(it.quantity)}
      </div>
      <div class="count-row">
        <div class="count ${zero?'zero':''}">${it.quantity}</div>
        <div class="count-unit">장 남음</div>
      </div>
      <button class="take-btn" data-take="${it.id}" ${zero?'disabled':''}>${zero ? '소진됨' : '한 장 가져가기 −1'}</button>
    </div>`;
  }
  function renderManage(){
    if(!items.length){
      manageList.innerHTML = `<div style="color:var(--ink-dim);font-size:13px;">등록된 항목이 없습니다.</div>`;
      return;
    }
    manageList.innerHTML = items.map(it=>`
      <div class="manage-item">
        <div class="mi-label"><b>${escapeHtml(it.level)}</b> · ${escapeHtml(it.test_type)}</div>
        <input type="number" min="0" value="${it.quantity}" data-setqty="${it.id}">
        <button class="btn small" data-resetbtn="${it.id}">적용</button>
        <button class="btn small danger" data-delbtn="${it.id}">삭제</button>
      </div>
    `).join('');
    manageList.querySelectorAll('[data-resetbtn]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.resetbtn;
        const input = manageList.querySelector(`input[data-setqty="${id}"]`);
        const item = items.find(i=>i.id===id);
        if(item) setQuantity(item, input.value);
      });
    });
    manageList.querySelectorAll('[data-delbtn]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.dataset.delbtn;
        const item = items.find(i=>i.id===id);
        if(item) deleteItem(item);
      });
    });
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  // initial load
  fetchAll();
  // realtime subscription — 모든 기기가 즉시 반영됨
  supa.channel('pretest_stock_changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'pretest_stock' }, () => {
      fetchAll();
    })
    .subscribe((status)=>{
      if(status === 'SUBSCRIBED') syncLabel.textContent = '실시간 연결됨';
    });
}</script>
</body>
</html>

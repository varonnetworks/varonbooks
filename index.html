<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>시스템 점검 중</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f4f4f6;
      text-align: center;
    }
    .box {
      padding: 40px;
    }
    h1 { color: #333; }
    p { color: #666; font-size: 16px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔧 시스템 점검 중입니다</h1>
    <p>데이터 이전 작업으로 인해 잠시 이용이 제한됩니다.<br>
    작업 완료 후 다시 안내드리겠습니다.</p>
  </div>
</body>
</html>
